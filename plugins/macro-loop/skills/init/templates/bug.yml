name: Bug
description: Something is broken
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: dropdown
    id: source
    attributes:
      label: How was this opened?
      options:
        - I need this myself
        - On someone else's behalf
        - While working on the code
    validations:
      required: true
