name: CI

on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/**/*.test.mjs"
      - run: node scripts/check-version-bump.mjs "origin/${{ github.base_ref }}" "${{ github.head_ref }}"
